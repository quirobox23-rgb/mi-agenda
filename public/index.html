<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi agenda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Una sola columna de bolsillo: arriba se dicta, debajo la agenda por días. */
:root {
  --papel: #f6f7f9;
  --hoja: #ffffff;
  --tinta: #1b2533;
  --tinta-suave: #5b6676;
  --linea: #dde2ea;
  --azul: #1f3a5f;
  --azul-claro: #e6edf6;
  --sol: #f2b632;
  --sol-tinta: #3a2a00;
  --ok: #2f7d4f;
  --alerta: #b4442f;
  --f-titulo: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radio: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #10161f; --hoja: #18212d; --tinta: #e8edf4; --tinta-suave: #9aa6b6; --linea: #2a3544;
    --azul: #9cc0ea; --azul-claro: #1f2c3d; --sol: #f2b632; --sol-tinta: #2a1e00; --ok: #6cc18f; --alerta: #f08a73;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #10161f; --hoja: #18212d; --tinta: #e8edf4; --tinta-suave: #9aa6b6; --linea: #2a3544;
  --azul: #9cc0ea; --azul-claro: #1f2c3d; --sol: #f2b632; --sol-tinta: #2a1e00; --ok: #6cc18f; --alerta: #f08a73;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--papel); color: var(--tinta);
  font: 17px/1.45 var(--f-texto);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 40px);
}
[hidden] { display: none !important; }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; }
h1, h2 { font-family: var(--f-titulo); margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.01em; color: var(--azul); }
h2 { font-size: 1.05rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta-suave); }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--sol); outline-offset: 2px; }

.cabecera { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cabecera p { margin: 2px 0 0; color: var(--tinta-suave); }
.boton-avisos {
  border: 1px solid var(--linea); background: var(--hoja); color: var(--tinta);
  border-radius: 999px; padding: 8px 14px; display: flex; gap: 8px; align-items: center; white-space: nowrap;
}
.botones-cabecera { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.boton-idioma { border: 1px solid var(--linea); background: transparent; color: var(--tinta-suave); border-radius: 999px; padding: 8px 12px; font-size: 0.9rem; }
.punto { width: 10px; height: 10px; border-radius: 50%; background: var(--alerta); }
.punto.activo { background: var(--ok); }

.aviso-modo { background: var(--azul-claro); border-radius: var(--radio); padding: 12px 14px; font-size: 0.95rem; }

/* Dictar */
.dictar { background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); padding: 16px; display: grid; gap: 12px; }
.dictar label { font-weight: 700; font-size: 1.1rem; }
.fila-entrada { display: flex; gap: 10px; align-items: stretch; }
textarea {
  flex: 1; min-width: 0; resize: none; font: inherit; color: var(--tinta); background: var(--papel);
  border: 1px solid var(--linea); border-radius: 12px; padding: 12px; min-height: 64px;
}
.microfono {
  flex: none; width: 64px; border: none; border-radius: 16px; background: var(--sol); color: var(--sol-tinta);
  display: grid; place-items: center;
}
.microfono svg { width: 30px; height: 30px; }
.microfono.escuchando { animation: latido 1s ease-in-out infinite; }
@keyframes latido { 50% { transform: scale(1.06); box-shadow: 0 0 0 8px color-mix(in srgb, var(--sol) 30%, transparent); } }
@media (prefers-reduced-motion: reduce) { .microfono.escuchando { animation: none; outline: 4px solid var(--sol); } }
.pista { margin: 0; color: var(--tinta-suave); font-size: 0.92rem; }
.ejemplos { display: flex; flex-wrap: wrap; gap: 8px; }
.ejemplos button { border: 1px dashed var(--linea); background: transparent; color: var(--tinta-suave); border-radius: 999px; padding: 4px 12px; font-size: 0.9rem; }

/* Vista previa de lo entendido */
.previa { border-top: 1px solid var(--linea); padding-top: 12px; display: grid; gap: 10px; }
.campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.campos .ancho { grid-column: 1 / -1; }
.campos label { display: grid; gap: 4px; font-size: 0.85rem; color: var(--tinta-suave); font-weight: 700; }
.campos input, .campos select {
  font: inherit; font-size: 1rem; color: var(--tinta); background: var(--papel);
  border: 1px solid var(--linea); border-radius: 10px; padding: 10px; min-width: 0; width: 100%;
}
.acciones { display: flex; gap: 10px; flex-wrap: wrap; }
.principal { background: var(--azul); color: var(--hoja); border: none; border-radius: 12px; padding: 12px 20px; font-weight: 700; }
.secundario { background: transparent; color: var(--tinta); border: 1px solid var(--linea); border-radius: 12px; padding: 12px 16px; }
.resumen-avisos { margin: 0; font-size: 0.92rem; color: var(--tinta-suave); }

/* Agenda */
.dia { display: grid; gap: 8px; }
.lista { list-style: none; margin: 0; padding: 0; background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); }
.lista li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; }
.lista li + li { border-top: 1px solid var(--linea); }
.hora { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--azul); width: 3.2em; flex: none; }
.hora.vacia { color: var(--tinta-suave); font-weight: 400; }
.titulo { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.hecho .titulo { text-decoration: line-through; color: var(--tinta-suave); }
.marcar {
  flex: none; width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--tinta-suave);
  background: transparent; display: grid; place-items: center; color: var(--hoja); padding: 0;
}
.hecho .marcar { background: var(--ok); border-color: var(--ok); }
.borrar { flex: none; border: none; background: transparent; color: var(--tinta-suave); width: 36px; height: 36px; border-radius: 8px; font-size: 1.3rem; }
.vacio { background: var(--hoja); border: 1px dashed var(--linea); border-radius: var(--radio); padding: 18px; color: var(--tinta-suave); margin: 0; }

/* Panel de avisos */
.panel { background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); padding: 16px; display: grid; gap: 14px; }
.panel h3 { margin: 0; font-family: var(--f-titulo); font-size: 1.15rem; }
.panel p, .panel ol { margin: 0; }
.panel ol { padding-left: 1.3em; display: grid; gap: 4px; }
.panel details { border-top: 1px solid var(--linea); padding-top: 12px; }
.panel summary { font-weight: 700; cursor: pointer; }
.panel details > * + * { margin-top: 10px; }
code { background: var(--azul-claro); padding: 1px 6px; border-radius: 6px; font-size: 0.92em; overflow-wrap: anywhere; }
.estado { font-size: 0.95rem; }
.estado.importante { background: color-mix(in srgb, var(--sol) 22%, var(--hoja)); border: 1px solid var(--sol); border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.panel summary { padding-block: 4px; }

.toast {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); max-width: 528px; margin: 0 auto;
  background: var(--tinta); color: var(--papel); border-radius: var(--radio); padding: 14px 16px; z-index: 20;
  box-shadow: 0 10px 30px rgb(0 0 0 / 0.25);
}
.toast strong { display: block; }
</style>
</head>
<body>
<main>
  <header class="cabecera">
    <div>
      <h1 data-t="titulo">Mi agenda</h1>
      <p id="hoy-texto"></p>
    </div>
    <div class="botones-cabecera">
      <button class="boton-idioma" id="cambiar-idioma" lang="ca">Català</button>
      <button class="boton-avisos" id="abrir-panel" aria-controls="panel"><span class="punto" id="punto"></span><span id="texto-avisos">Avisos</span></button>
    </div>
  </header>

  <p class="aviso-modo" id="aviso-modo" data-t="modoPrueba" hidden></p>

  <section class="panel" id="panel" hidden>
    <h3 data-t="avisosMovil"></h3>
    <p class="estado" id="estado-push"></p>
    <div class="acciones">
      <button class="principal" id="activar-push" data-t="activarAvisos"></button>
      <button class="secundario" id="probar" data-t="probar"></button>
    </div>
    <details id="det-iphone">
      <summary data-t="tengoIphone"></summary>
      <ol data-t-html="pasosIphone"></ol>
    </details>
    <details id="det-android">
      <summary data-t="tengoAndroid"></summary>
      <ol data-t-html="pasosAndroid"></ol>
    </details>
    <details>
      <summary data-t="waTitulo"></summary>
      <p data-t="waIntro"></p>
      <ol data-t-html="waPasos"></ol>
      <div class="campos">
        <label class="ancho"><span data-t="waNumero"></span> <input id="wa-tel" inputmode="tel" placeholder="+34 600 000 000"></label>
        <label class="ancho"><span data-t="waClave"></span> <input id="wa-clave" inputmode="numeric" placeholder="123456"></label>
      </div>
      <div class="acciones"><button class="secundario" id="guardar-wa" data-t="waGuardar"></button></div>
    </details>
    <details>
      <summary data-t="otroMovil"></summary>
      <p data-t="otroMovilTexto"></p>
      <p><code id="enlace-personal"></code></p>
      <div class="acciones"><button class="secundario" id="copiar-enlace" data-t="copiarEnlace"></button></div>
    </details>
  </section>

  <section class="dictar" aria-labelledby="etiqueta-frase">
    <label id="etiqueta-frase" for="frase" data-t="pregunta"></label>
    <div class="fila-entrada">
      <textarea id="frase" rows="2" data-t-ph="ejemploFrase"></textarea>
      <button class="microfono" id="microfono" data-t-aria="hablar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
      </button>
    </div>
    <p class="pista" id="pista-voz"></p>
    <div class="ejemplos" id="ejemplos"></div>

    <div class="previa" id="previa" hidden>
      <div class="campos">
        <label class="ancho"><span data-t="que"></span> <input id="p-titulo"></label>
        <label><span data-t="dia"></span> <input id="p-fecha" type="date"></label>
        <label><span data-t="hora"></span> <input id="p-hora" type="time"></label>
        <label class="ancho"><span data-t="esUna"></span>
          <select id="p-tipo"><option value="cita" data-t="opcionCita"></option><option value="tarea" data-t="opcionTarea"></option></select>
        </label>
      </div>
      <p class="resumen-avisos" id="p-avisos"></p>
      <div class="acciones">
        <button class="principal" id="guardar" data-t="guardar"></button>
        <button class="secundario" id="cancelar" data-t="cancelar"></button>
      </div>
    </div>
  </section>

  <div id="agenda"></div>
</main>
<div class="toast" id="toast" role="status" hidden></div>

    noCarga: "No s'ha pogut carregar l'agenda", revisaConexion: "Revisa la connexió i torna-la a obrir.",
    copiado: "Copiat", pegalo: "Enganxa'l a l'altre mòbil.",
    demoEstado: "En aquesta prova els avisos surten com un missatge a la pàgina, només mentre està oberta.",
    soloInstalada: "Només a la versió instal·lada", demoWa: "A la prova no es poden enviar WhatsApp.",
    avisoPrueba: "🔔 Avís de prova", asiLlegan: "Així t'arribaran els recordatoris.",
    noSoportaIphone: "Així no et poden arribar avisos. Obre l'agenda amb Safari, afegeix-la a la pantalla d'inici i obre-la des de la icona nova. T'ho explico aquí sota.",
    noSoportaAndroid: "Així no et poden arribar avisos. Obre l'agenda amb Chrome escrivint l'adreça. T'ho explico aquí sota.",
    activados: "Els avisos estan activats en aquest mòbil.",
    tocaBoton: "Toca el botó perquè l'agenda t'avisi encara que el mòbil estigui bloquejat.",
    dijisteNo: "Has dit que no als avisos. Per canviar-ho, ves a la configuració del navegador → Notificacions.",
    listo: "Fet. Els avisos estan activats en aquest mòbil.", errorActivar: "No s'han pogut activar els avisos: ",
    enviado: "Enviat", llegara: "D'aquí a uns segons t'arribarà l'avís.",
    primeroActiva: "Primer activa els avisos", tocaActivar: "Toca «Activa els avisos» i accepta el permís.",
    noSalido: "L'avís no ha sortit", movil: "Mòbil", noEnviar: "No s'ha pogut enviar", otraVez: "Torna-ho a provar d'aquí a una estona",
    waGuardado: "WhatsApp desat. Fes servir «Envia'm un avís de prova» per comprovar-ho.", waQuitado: "WhatsApp tret.",
    errorPreparar: "No s'han pogut preparar els avisos: ", esHoy: "És avui", aLasMay: "A les",
    ejemplosDemo: ["Recollir la Lucía de l'escola (exemple)", "Dentista (exemple)", "Comprar pa (exemple)"],
    dias: ["diumenge", "dilluns", "dimarts", "dimecres", "dijous", "divendres", "dissabte"],
    meses: ["gener", "febrer", "març", "abril", "maig", "juny", "juliol", "agost", "setembre", "octubre", "novembre", "desembre"],
    fecha: (dia, n, mes) => `${dia} ${n} ${/^[aeiou]/.test(mes) ? "d'" : "de "}${mes}`, voz: "ca-ES",
  },
};

const guardarLocal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const leerLocal = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } };

let idioma = leerLocal("idioma", null) || ((navigator.language || "").toLowerCase().startsWith("ca") ? "ca" : "es");
const t = (clave) => TEXTOS[idioma][clave];

function traducir() {
  document.documentElement.lang = idioma;
  document.title = t("titulo");
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
  document.querySelectorAll("[data-t-html]").forEach((el) => (el.innerHTML = t(el.dataset.tHtml)));
  document.querySelectorAll("[data-t-ph]").forEach((el) => (el.placeholder = t(el.dataset.tPh)));
  document.querySelectorAll("[data-t-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.tAria)));
  $("cambiar-idioma").textContent = t("otroIdioma");
  $("cambiar-idioma").lang = idioma === "es" ? "ca" : "es";
  $("pista-voz").textContent = Reconocimiento ? t("pistaVoz") : t("pistaTeclado");
  $("ejemplos").replaceChildren(...t("ejemplos").map((e) => { const b = document.createElement("button"); b.textContent = e; return b; }));
}

const $ = (id) => document.getElementById(id);
const dos = (n) => String(n).padStart(2, "0");
const isoHoy = (d = new Date()) => `${d.getFullYear()}-${dos(d.getMonth() + 1)}-${dos(d.getDate())}`;
const sumarDias = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); return isoHoy(new Date(y, m - 1, d + n)); };
const aDate = (fecha, hora = "00:00") => { const [y, m, d] = fecha.split("-").map(Number); const [h, mi] = hora.split(":").map(Number); return new Date(y, m - 1, d, h, mi); };
const bonita = (iso) => { const d = aDate(iso); return t("fecha")(t("dias")[d.getDay()], d.getDate(), t("meses")[d.getMonth()]); };

// Cada persona tiene un código secreto propio; con él se abre su agenda en otro móvil.
const enlace = new URLSearchParams(location.search).get("u");
let uid = (enlace && /^[a-z0-9]{16,64}$/.test(enlace) ? enlace : null) || leerLocal("uid", null);
if (!uid) uid = [...crypto.getRandomValues(new Uint8Array(32))].map((b) => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
guardarLocal("uid", uid);

const Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;
traducir();

// ---------- Dónde se guardan las cosas: en el servidor gratuito o, en modo prueba, en este móvil ----------
const api = async (ruta, opciones = {}) => {
  const r = await fetch(`/api${ruta}`, { headers: { "Content-Type": "application/json" }, ...opciones });
  if (!r.ok) throw new Error(`Error ${r.status}`);
  return r.json();
};
let conServidor = false;
try {
  const ctl = new AbortController(); setTimeout(() => ctl.abort(), 4000);
  const r = await fetch("/api/vapid", { signal: ctl.signal });
  conServidor = r.ok && (r.headers.get("content-type") || "").includes("json");
} catch {}

function avisosDe(item, ahora = new Date()) {
  if (!item.fecha) return [];
  if (!item.hora) return [aDate(item.fecha, "09:00")].filter((a) => a > ahora);
  const momento = aDate(item.fecha, item.hora);
  const falta = momento - ahora;
  const lista = [falta > 3 * 3600e3 ? new Date(momento - 3600e3) : falta > 20 * 60e3 ? new Date(momento - 15 * 60e3) : momento];
  if (item.tipo === "cita" && item.fecha > isoHoy(ahora)) lista.push(aDate(sumarDias(item.fecha, -1), "20:00"));
  return lista.filter((a) => a > ahora).sort((a, b) => a - b);
}

const almacen = conServidor ? {
  lista: () => api(`/items?uid=${uid}`),
  crear: (item) => api("/items", { method: "POST", body: JSON.stringify({ uid, ...item }) }),
  marcar: (id, hecho) => api(`/items/${id}`, { method: "PATCH", body: JSON.stringify({ uid, hecho }) }),
  borrar: (id) => api(`/items/${id}?uid=${uid}`, { method: "DELETE" }),
} : {
  lista: async () => leerLocal("items", ejemplos()),
  crear: async (item) => { const l = leerLocal("items", ejemplos()); const n = { id: Date.now(), hecho: 0, ...item, avisos: avisosDe(item).map((a) => a.toISOString()) }; l.push(n); guardarLocal("items", l); return n; },
  marcar: async (id, hecho) => { const l = leerLocal("items", ejemplos()); l.forEach((i) => { if (i.id === id) i.hecho = hecho ? 1 : 0; }); guardarLocal("items", l); },
  borrar: async (id) => guardarLocal("items", leerLocal("items", ejemplos()).filter((i) => i.id !== id)),
};

// Unos ejemplos para que la prueba no empiece vacía.
function ejemplos() {
  const hoy = isoHoy();
  const [a, b, c] = t("ejemplosDemo");
  const l = [
    { id: 1, tipo: "cita", titulo: a, fecha: hoy, hora: "17:00", hecho: 0 },
    { id: 2, tipo: "cita", titulo: b, fecha: sumarDias(hoy, 1), hora: "10:30", hecho: 0 },
    { id: 3, tipo: "tarea", titulo: c, fecha: null, hora: null, hecho: 0 },
  ];
  l.forEach((i) => (i.avisos = avisosDe(i).map((x) => x.toISOString())));
  return l;
}

// ---------- Pintar la agenda ----------
let items = [];
async function cargar() {
  try { items = await almacen.lista(); } catch { mostrarToast(t("noCarga"), t("revisaConexion")); }
  pintar();
}

function pintar() {
  const hoy = isoHoy();
  $("hoy-texto").textContent = bonita(hoy).replace(/^./, (c) => c.toUpperCase());
  const grupos = new Map();
  const pasadas = [];
  for (const i of items) {
    if (i.fecha && i.fecha < hoy) { if (i.tipo === "tarea" && !i.hecho) pasadas.push(i); continue; }
    const clave = i.fecha || "sin-fecha";
    if (!grupos.has(clave)) grupos.set(clave, []);
    grupos.get(clave).push(i);
  }
  if (!grupos.has(hoy)) grupos.set(hoy, []);
  const claves = [...grupos.keys()].sort((a, b) => (a === "sin-fecha") - (b === "sin-fecha") || a.localeCompare(b));
  const cont = $("agenda");
  cont.replaceChildren();
  const seccion = (nombre, lista, vacio) => {
    const s = document.createElement("section");
    s.className = "dia";
    const h = document.createElement("h2"); h.textContent = nombre; s.append(h);
    if (!lista.length) { const p = document.createElement("p"); p.className = "vacio"; p.textContent = vacio; s.append(p); }
    else {
      const ul = document.createElement("ul"); ul.className = "lista";
      lista.sort((a, b) => (a.hora || "99").localeCompare(b.hora || "99")).forEach((i) => ul.append(fila(i)));
      s.append(ul);
    }
    cont.append(s);
  };
  if (pasadas.length) seccion(t("sePaso"), pasadas, "");
  for (const c of claves) {
    const nombre = c === "sin-fecha" ? t("sinFecha") : c === hoy ? t("hoy") : c === sumarDias(hoy, 1) ? t("manana") : bonita(c);
    seccion(nombre, grupos.get(c), c === hoy ? t("nadaHoy") : "");
  }
}

function fila(i) {
  const li = document.createElement("li");
  if (i.hecho) li.classList.add("hecho");
  if (i.tipo === "tarea") {
    const b = document.createElement("button");
    b.className = "marcar"; b.setAttribute("aria-label", i.hecho ? t("marcarNoHecha") : t("marcarHecha"));
    b.innerHTML = i.hecho ? '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2.4" fill="none"/></svg>' : "";
    b.onclick = async () => { i.hecho = i.hecho ? 0 : 1; await almacen.marcar(i.id, i.hecho); pintar(); };
    li.append(b);
  } else {
    const h = document.createElement("span");
    h.className = "hora" + (i.hora ? "" : " vacia");
    h.textContent = i.hora || t("todoElDia");
    if (!i.hora) h.style.fontSize = "0.8rem";
    li.append(h);
  }
  const titulo = document.createElement("span"); titulo.className = "titulo"; titulo.textContent = i.titulo;
  const borrar = document.createElement("button");
  borrar.className = "borrar"; borrar.setAttribute("aria-label", `${t("borrar")} ${i.titulo}`); borrar.textContent = "×";
  let pendiente = false;
  borrar.onclick = async () => {
    if (!pendiente) { pendiente = true; borrar.textContent = t("borrarPregunta"); borrar.style.width = "auto"; borrar.style.fontSize = "0.9rem"; setTimeout(() => { pendiente = false; borrar.textContent = "×"; borrar.style = ""; }, 3000); return; }
    await almacen.borrar(i.id); items = items.filter((x) => x !== i); pintar();
  };
  li.append(titulo, borrar);
  return li;
}

// ---------- Apuntar ----------
function entender() {
  const texto = $("frase").value.trim();
  if (!texto) return;
  const r = interpretar(texto);
  $("p-titulo").value = r.titulo; $("p-fecha").value = r.fecha || ""; $("p-hora").value = r.hora || ""; $("p-tipo").value = r.tipo;
  $("previa").hidden = false;
  explicarAvisos();
}
function itemPrevio() {
  const fecha = $("p-fecha").value || null;
  return { titulo: $("p-titulo").value.trim() || t("recordatorio"), fecha, hora: fecha ? $("p-hora").value || null : null, tipo: $("p-tipo").value };
}
function explicarAvisos() {
  const it = itemPrevio();
  const av = avisosDe(it);
  const hoy = isoHoy();
  const cuando = (d) => { const f = isoHoy(d); return `${f === hoy ? t("hoyMin") : f === sumarDias(hoy, 1) ? t("mananaMin") : t("el") + " " + bonita(f)} ${t("aLas")} ${dos(d.getHours())}:${dos(d.getMinutes())}`; };
  $("p-avisos").textContent = !it.fecha ? t("avisoSinFecha") : av.length ? t("teAvisare")(av.map(cuando)) : t("horaPasada");
}
["p-fecha", "p-hora", "p-tipo"].forEach((id) => $(id).addEventListener("input", explicarAvisos));

$("frase").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); entender(); } });
$("frase").addEventListener("blur", () => { if ($("frase").value.trim() && $("previa").hidden) entender(); });
$("ejemplos").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") { $("frase").value = e.target.textContent; entender(); } });
$("cancelar").onclick = () => { $("previa").hidden = true; $("frase").value = ""; };
$("guardar").onclick = async () => {
  const it = itemPrevio();
  try {
    const nuevo = await almacen.crear(it);
    items.push(nuevo);
    $("previa").hidden = true; $("frase").value = "";
    pintar();
    mostrarToast(t("apuntado"), `${it.titulo}${it.fecha ? ", " + bonita(it.fecha) : ""}${it.hora ? ` ${t("aLas")} ${it.hora}` : ""}`);
  } catch { mostrarToast(t("noGuardado"), t("sinConexion")); }
};

// ---------- Hablar ----------
$("microfono").onclick = () => {
  if (!Reconocimiento) { $("frase").focus(); return; }
  const rec = new Reconocimiento();
  rec.lang = t("voz"); rec.interimResults = true;
  $("microfono").classList.add("escuchando");
  $("pista-voz").textContent = t("escuchando");
  rec.onresult = (e) => { $("frase").value = [...e.results].map((r) => r[0].transcript).join(" "); };
  rec.onerror = () => { $("pista-voz").textContent = t("errorMicro"); };
  rec.onend = () => { $("microfono").classList.remove("escuchando"); if ($("pista-voz").textContent === t("escuchando")) $("pista-voz").textContent = t("pistaVoz"); entender(); };
  try { rec.start(); } catch { rec.onerror(); }
};

// ---------- Avisos ----------
function mostrarToast(titulo, texto) {
  const toast = $("toast");
  toast.innerHTML = ""; const s = document.createElement("strong"); s.textContent = titulo; toast.append(s, document.createTextNode(texto));
  toast.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (toast.hidden = true), 6000);
  try { navigator.vibrate?.([200, 100, 200]); } catch {}
}

$("abrir-panel").onclick = () => { $("panel").hidden = !$("panel").hidden; };
const enlacePersonal = `${location.origin}${location.pathname}?u=${uid}`;
$("enlace-personal").textContent = enlacePersonal;
$("copiar-enlace").onclick = async () => {
  try { await navigator.clipboard.writeText(enlacePersonal); mostrarToast(t("copiado"), t("pegalo")); }
  catch { const r = document.createRange(); r.selectNodeContents($("enlace-personal")); getSelection().removeAllRanges(); getSelection().addRange(r); }
};

// El estado de los avisos se guarda como clave de texto para poder repintarlo al cambiar de idioma.
let estadoActual = { activo: false, clave: null, extra: "" };
function estadoAvisos(activo, clave, extra = "") {
  estadoActual = { activo, clave, extra };
  $("punto").classList.toggle("activo", activo);
  $("texto-avisos").textContent = conServidor ? (activo ? t("avisosActivados") : t("activarAvisos")) : t("avisos");
  $("estado-push").textContent = clave ? t(clave) + extra : "";
}

$("cambiar-idioma").onclick = () => {
  idioma = idioma === "es" ? "ca" : "es";
  guardarLocal("idioma", idioma);
  traducir();
  pintar();
  estadoAvisos(estadoActual.activo, estadoActual.clave, estadoActual.extra);
  if (!$("previa").hidden) explicarAvisos();
  if (conServidor) api("/usuario", { method: "POST", body: JSON.stringify({ uid, idioma }) }).catch(() => {});
};

const b64aBytes = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
let registro = null;

async function prepararAvisos() {
  if (!conServidor) {
    $("aviso-modo").hidden = false;
    estadoAvisos(false, "demoEstado");
    $("activar-push").hidden = true;
    $("guardar-wa").onclick = () => mostrarToast(t("soloInstalada"), t("demoWa"));
    $("probar").onclick = () => mostrarToast(t("avisoPrueba"), t("asiLlegan"));
    setInterval(revisarAvisosLocales, 20000);
    return;
  }
  const usuario = await api("/usuario", { method: "POST", body: JSON.stringify({ uid, idioma, zona: Intl.DateTimeFormat().resolvedOptions().timeZone }) });
  if (usuario.whatsapp) $("wa-tel").value = usuario.whatsapp;
  const soporta = "serviceWorker" in navigator && "PushManager" in window;
  if (soporta) registro = await navigator.serviceWorker.register(`sw.js?uid=${uid}`);
  const esIphone = /iphone|ipad/i.test(navigator.userAgent);
  if (!soporta) {
    estadoAvisos(!!usuario.whatsapp, esIphone ? "noSoportaIphone" : "noSoportaAndroid");
    $("estado-push").classList.add("importante");
    $(esIphone ? "det-iphone" : "det-android").open = true;
    $("activar-push").hidden = true;
    $("probar").hidden = !usuario.whatsapp;
    $("panel").hidden = false;
  } else {
    const sub = await registro.pushManager.getSubscription();
    if (sub && Notification.permission === "granted") {
      await api("/usuario", { method: "POST", body: JSON.stringify({ uid, suscripcion: sub.toJSON() }) });
      estadoAvisos(true, "activados");
      $("activar-push").hidden = true;
    } else {
      estadoAvisos(usuario.push || !!usuario.whatsapp, "tocaBoton");
      if (!usuario.push && !usuario.whatsapp) $("panel").hidden = false;
    }
  }
  $("activar-push").onclick = async () => {
    try {
      const permiso = await Notification.requestPermission();
      if (permiso !== "granted") { estadoAvisos(false, "dijisteNo"); return; }
      const { clave } = await api("/vapid");
      const sub = await registro.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64aBytes(clave) });
      await api("/usuario", { method: "POST", body: JSON.stringify({ uid, suscripcion: sub.toJSON() }) });
      estadoAvisos(true, "listo");
      $("activar-push").hidden = true;
    } catch (e) { estadoAvisos(false, "errorActivar", e.message); }
  };
  $("probar").onclick = async () => {
    try {
      const r = await api("/probar", { method: "POST", body: JSON.stringify({ uid }) });
      if (r.push === "ok" || r.whatsapp === "ok") mostrarToast(t("enviado"), t("llegara"));
      else if (r.push === "sin activar" && r.whatsapp === "sin activar") mostrarToast(t("primeroActiva"), t("tocaActivar"));
      else mostrarToast(t("noSalido"), `${t("movil")}: ${r.push}. WhatsApp: ${r.whatsapp}.`);
    }
    catch (e) { mostrarToast(t("noEnviar"), `${t("otraVez")} (${e.message}).`); }
  };
  $("guardar-wa").onclick = async () => {
    const r = await api("/usuario", { method: "POST", body: JSON.stringify({ uid, whatsapp: { telefono: $("wa-tel").value, clave: $("wa-clave").value } }) });
    estadoAvisos(true, r.whatsapp ? "waGuardado" : "waQuitado");
  };
}

// En modo prueba, los avisos los vigila la propia página.
function revisarAvisosLocales() {
  const ahora = Date.now();
  let cambiado = false;
  for (const i of items) {
    const vencidos = (i.avisos || []).filter((a) => Date.parse(a) <= ahora);
    if (!vencidos.length) continue;
    if (!i.hecho && vencidos.some((a) => Date.parse(a) > ahora - 5 * 60000)) mostrarToast(`⏰ ${i.titulo}`, i.hora ? `${t("aLasMay")} ${i.hora}` : t("esHoy"));
    i.avisos = i.avisos.filter((a) => Date.parse(a) > ahora);
    cambiado = true;
  }
  if (cambiado) guardarLocal("items", items);
}

await cargar();
prepararAvisos().catch((e) => estadoAvisos(false, "errorPreparar", e.message));
</script>
